name: Ingest futuros agropecuários (B3)

on:
  schedule:
    # Dias úteis, 23:47 UTC (20:47 BRT) — depois da publicação do Boletim
    # Diário do Mercado, que a própria B3 mostrou atualizar por volta das
    # 20:36 BRT.
    - cron: "47 23 * * 1-5"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-b3-futuros.mjs
