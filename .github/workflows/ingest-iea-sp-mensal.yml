name: Ingest IEA-SP monthly prices

on:
  schedule:
    # Semanal (segunda, 9h30 America/Sao_Paulo = 12h30 UTC): o IEA fecha um mês novo por vez, com ~4 meses de atraso.
    # Minuto 30 (não 0) para o GitHub Actions não atrasar o run (mesmo achado de reativacao.yml em 2026-10-10).
    - cron: "30 12 * * 1"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-iea-sp-mensal.mjs
