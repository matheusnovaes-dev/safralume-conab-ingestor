name: Verificar entregas de WhatsApp (reabrir falhas reais)

on:
  schedule:
    # Todo dia ~13:05 UTC (~10:05 BRT) — antes do lembrete de retomada
    # (13:30 UTC) e da reativação (14:17 UTC), pra quem teve falha real de
    # entrega já entrar reaberto no mesmo dia. Minuto 5 (não 0) de
    # propósito — mesmo achado de 2026-10-10 em reativacao.yml: hora cheia
    # exata faz o GitHub Actions atrasar o run de verdade por horas.
    - cron: "5 13 * * *"
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o endpoint de verificação de entregas do painel
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://www.safralume.com.br/api/cron/verificar-entregas
