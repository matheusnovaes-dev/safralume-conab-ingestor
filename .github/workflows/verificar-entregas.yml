name: Verificar entregas de WhatsApp (reabrir falhas reais)

on:
  schedule:
    # Todo dia às 13:00 UTC (10:00 BRT) — antes do lembrete de retomada
    # (13:30 UTC) e da reativação (14:00 UTC), pra quem teve falha real de
    # entrega já entrar reaberto no mesmo dia.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o endpoint de verificação de entregas do painel
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://www.safralume.com.br/api/cron/verificar-entregas
