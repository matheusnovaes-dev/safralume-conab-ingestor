name: Ingest DERAL/SEAB-PR weekly prices

on:
  schedule:
    # Sexta ~19h09 America/Sao_Paulo (UTC-3) = ~22h09 UTC — depois do boletim
    # semanal do DERAL (publicado ao longo da sexta-feira). Minuto 9 (não 0)
    # de propósito — mesmo achado de 2026-10-10 em reativacao.yml: hora
    # cheia exata faz o GitHub Actions atrasar o run de verdade por horas.
    - cron: "9 22 * * 5"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-deral-pr.mjs
