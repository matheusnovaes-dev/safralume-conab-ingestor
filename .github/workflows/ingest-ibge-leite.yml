name: Ingest leite por UF (IBGE/PPM)

on:
  schedule:
    # Todo dia 20, 15:10 UTC. A PPM é anual (sai no fim do ano), mas rodar todo
    # mês é barato e pega a publicação nova sem depender de acertar a data.
    - cron: "10 15 20 * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-ibge-leite.mjs
