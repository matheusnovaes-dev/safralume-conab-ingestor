name: Ingest preços de insumos (Conab)

on:
  schedule:
    # Toda quarta-feira, 13:00 UTC — a publicação é bimestral (meses
    # ímpares, segundo a própria Conab) e sem dia fixo conhecido ainda, então
    # poll semanal é barato e o upsert é idempotente: só atualiza quando sai
    # publicação nova de verdade.
    - cron: "0 13 * * 3"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-precos-insumos.mjs
