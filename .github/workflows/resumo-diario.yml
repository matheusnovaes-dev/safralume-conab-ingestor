name: Resumo diário (bom dia resumido)

on:
  # O disparo agendado vive no n8n (workflow "Resumo diário (de hora em hora, minuto 5)", id oZpp1qEWd7KfSIqY): o cron do
  # GitHub atrasava e pulava horas (falhou em 21/10) e gastava minutos do plano. Este workflow ficou só para disparo manual.
  workflow_dispatch: {}

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o endpoint de resumo diário do painel
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://www.safralume.com.br/api/cron/resumo-diario
