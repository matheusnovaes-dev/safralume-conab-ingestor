name: Ingest Conab prices

on:
  schedule:
    # 09:00 America/Sao_Paulo (UTC-3) = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dias_historico:
        description: "Quantos dias pra trás buscar (padrão: 40, cobre a janela normal). Use um valor grande (ex: 730) só pra um backfill único."
        required: false
        default: "40"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIAS_HISTORICO: ${{ github.event.inputs.dias_historico || '40' }}
        run: bun run ingest.mjs

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure.png
          retention-days: 7
