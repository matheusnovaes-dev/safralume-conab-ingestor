name: Ingest Conab prices

on:
  schedule:
    # 3x/dia (9h, 17h, 23h America/Sao_Paulo = 12h, 20h, 02h UTC) — pedido
    # do Matheus 2026-10-12: essa é a fonte principal ("vale ouro"), já
    # teve uma saída do ar de vários dias sem a gente notar na hora: mais
    # passadas por dia pega tanto uma publicação atrasada no mesmo dia
    # quanto uma recuperação de outage mais rápido. Minuto 12 (não 0) de
    # propósito — o GitHub Actions atrasa/derruba agendamentos concentrados
    # na hora cheia (":00"), problema conhecido da plataforma; achado
    # investigando um dia inteiro sem rodar (27-28/08/2026).
    # 2026-10-16: o horário das 23h BRT (02:12 UTC) era adiado pelo GitHub em 4 a 5 h e caía de madrugada,
    # quando o site da Conab recusa conexão (ERR_CONNECTION_REFUSED todo dia ~04h BRT). Agora 8h, 13h e 18h BRT
    # (11:12, 16:12 e 21:12 UTC): mesmo com atraso de horas a execução cai com o site no ar.
    - cron: "12 11 * * *"
    - cron: "12 16 * * *"
    - cron: "12 21 * * *"
  workflow_dispatch:
    inputs:
      dias_historico:
        description: "Quantos dias pra trás buscar (padrão: 40, cobre a janela normal). Use um valor grande (ex: 730) só pra um backfill único."
        required: false
        default: "40"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIAS_HISTORICO: ${{ github.event.inputs.dias_historico || '40' }}
        run: bun run ingest.mjs

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure.png
          retention-days: 7
