name: Ingest IMEA weekly bulletins

on:
  schedule:
    # Diário às 18:30 America/Sao_Paulo (UTC-3) = 21:30 UTC — depois do
    # horário de publicação do boletim (17h). O boletim só sai em dias
    # específicos do mês (3, 10, 17, 24, 31); nos outros dias o script
    # detecta que já temos a edição mais recente e não faz nada.
    - cron: "30 21 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-imea.mjs
