name: Ingest IMEA weekly bulletins

on:
  schedule:
    # 3x/dia (9h, 17h, 23h America/Sao_Paulo = 12h, 20h, 02h UTC) — pedido
    # do Matheus 2026-10-12, mesmo padrão aplicado nas 6 fontes diárias de
    # preço/câmbio. O boletim só sai em dias específicos do mês (3, 10,
    # 17, 24, 31); nos outros dias e nas outras passadas do mesmo dia o
    # script detecta que já temos a edição mais recente e não faz nada.
    - cron: "30 12 * * *"
    - cron: "30 20 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-imea.mjs
