name: Ingest freight rates (Conab)

on:
  schedule:
    # Terça 09:45 America/Sao_Paulo (UTC-3) = 12:45 UTC — logo depois do
    # ingest de frete da Sifreca, frequência semanal. É um fetch direto de
    # arquivo público (sem navegador), então rodar toda semana não tem custo.
    - cron: "45 12 * * 2"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-frete-conab.mjs
