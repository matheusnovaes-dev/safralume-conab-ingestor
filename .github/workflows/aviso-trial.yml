name: Avisar trial expirando

on:
  schedule:
    # Todo dia ~12:09 UTC (~09:09 BRT) — depois que o webhook do dia
    # anterior teve tempo de assentar, ainda de manhã. Minuto 9 (não 0) de
    # propósito — mesmo achado de 2026-10-10 em reativacao.yml: hora cheia
    # exata faz o GitHub Actions atrasar o run de verdade por horas.
    - cron: "9 12 * * *"
  workflow_dispatch: {}

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o endpoint de aviso do painel
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://www.safralume.com.br/api/cron/aviso-trial
