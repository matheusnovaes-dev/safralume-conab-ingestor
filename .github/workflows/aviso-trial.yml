name: Avisar trial expirando

on:
  # 10/11/2026: o horário agora é do n8n (workflow "...(9h09, Brasília)"). O agendamento do GitHub atrasava este disparo por ~7 horas
  # (a rotina agendada para 9h saía às 16h). Fica só o disparo manual, como reserva.
  workflow_dispatch: {}

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o endpoint de aviso do painel
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://www.safralume.com.br/api/cron/aviso-trial
