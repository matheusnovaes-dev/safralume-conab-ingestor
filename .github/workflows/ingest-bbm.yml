name: Ingest BBM daily prices

on:
  schedule:
    # 3x/dia (9h, 17h, 23h America/Sao_Paulo = 12h, 20h, 02h UTC) — pedido
    # do Matheus 2026-10-12. Confirmado ao vivo nessa data que a página
    # publica num horário fixo (17:00 local, não uma janela vaga), então
    # a passada das 17h já pega quase sempre; as outras duas são rede de
    # segurança pra uma publicação atrasada ou um reprocessamento.
    - cron: "30 12 * * *"
    - cron: "30 20 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-bbm.mjs
