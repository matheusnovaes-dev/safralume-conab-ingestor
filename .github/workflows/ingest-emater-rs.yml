name: Ingest Emater/RS weekly prices

on:
  # Sem schedule aqui de propósito: emater.tche.br bloqueia IP de datacenter
  # fora do Brasil (confirmado: falha no runner do GitHub Actions e no VPS
  # Hetzner na Alemanha). Resolvido 2026-09-03 rodando numa VM Oracle Cloud
  # "Always Free" na região São Paulo (confirmado reachable de lá) — é essa
  # VM que roda o ingest de verdade agora, via cron diário (08:15 UTC), não
  # o GitHub Actions. Ver reference-safralume-systems na memória do Claude
  # pro IP/acesso da VM. workflow_dispatch fica só como fallback manual pra
  # debug — vai continuar falhando com ConnectionRefused se disparado daqui.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-emater-rs.mjs
