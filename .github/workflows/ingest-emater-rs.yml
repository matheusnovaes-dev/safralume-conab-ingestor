name: Ingest Emater/RS weekly prices

on:
  # Sem schedule por enquanto: emater.tche.br bloqueia IP de datacenter/fora
  # do Brasil (confirmado: falha tanto no runner do GitHub Actions quanto no
  # nosso VPS Hetzner na Alemanha; funciona normalmente de IP residencial/BR).
  # Rodar via workflow_dispatch manual até decidirmos proxy BR ou VPS BR.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-emater-rs.mjs
