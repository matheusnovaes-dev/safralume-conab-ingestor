name: Vigiar frescor das fontes de preço

on:
  schedule:
    # Todo dia às 8h20 (America/Sao_Paulo) = 11h20 UTC, depois das passadas da madrugada. Minuto 20
    # (não 0) pelo mesmo motivo dos outros agendamentos: o Actions atrasa a hora cheia.
    - cron: "20 11 * * *"
  workflow_dispatch: {}

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Checar frescor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run check-frescor-fontes.mjs
