name: Coleta B (preços, 1x por dia)

on:
  # SEM agendamento do GitHub (02/11/2026): o cron do Actions atrasa de 4 a 7 h e a coleta só rodava à tarde. Quem dispara é o fluxo do n8n
  # "Disparar coleta de preços (6h20)" (workflow_dispatch às 06h20 de Brasília, avisa o Matheus no Telegram se o disparo falhar). Manter o
  # agendamento junto rodaria a coleta DUAS vezes por dia na fonte; o vigia de frescor (check-frescor-fontes.mjs) avisa se ficar 36 h sem gravar.
  workflow_dispatch: {}
  # Disparo manual por push: alterar o arquivo marcador abaixo inicia a execução (o agendamento do GitHub atrasa ou descarta workflows novos).
  push:
    paths:
      - ".github/coleta-b-disparo.txt"

# Uma coleta por vez: nunca duas sessões ao mesmo tempo no a fonte (uma nova espera a anterior terminar).
concurrency:
  group: coleta-b
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # ~2 a 3 h de navegação com ritmo humano (248 produtos, ~440 ações) + a espera inicial; repositório público: minutos grátis
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Grava só onde concorda com a fonte atual ou onde não há dado (ver coleta-b-regras.mjs). "1" = só leitura.
          COLETA_B_SO_LER: "0"
        run: bun run coleta-b.mjs
      - name: Upload run snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-b-snapshot
          path: coleta-b-snapshot.json
          retention-days: 7
