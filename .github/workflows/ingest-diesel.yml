name: Ingest diesel (ANP)

on:
  schedule:
    # Terça 14:20 UTC (11:20 Brasília) — o resumo semanal (sáb a sex)
    # costuma publicar na segunda, esse horário dá margem de um dia.
    - cron: "20 14 * * 2"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-diesel.mjs
