name: Checar alertas de preço

on:
  schedule:
    # De 2 em 2 horas — o n8n manda a mensagem de alerta a cada hora
    # (disparado_em setado), então rodar a cada 2h garante que um alerta
    # recém-disparado não fique esperando mais de ~1h extra pra ser
    # detectado e entrar na fila de envio.
    # 29/10: o Actions rodava isso a cada 6-8 h em vez de 2 h (ontem: 01:17, 08:23, 16:35, 22:31 UTC) e o aviso de preço chegava com horas de atraso.
    # Agora há duas chamadas por hora em minutos fora do pico; é seguro (só olha alertas ainda não disparados e marca disparado_em) e o Actions que atrasar
    # uma deixa a outra pegar.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-alertas-preco
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run check-alertas-preco.mjs
