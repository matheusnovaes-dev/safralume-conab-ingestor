name: Ingest agenda de leilões

on:
  schedule:
    # Todo dia, ~11:09 UTC — a agenda muda com frequência (novos leilões
    # entram, outros viram "ao vivo" ou saem da lista), payload pequeno
    # (~35 páginas por rodada). Minuto 9 (não 0) de propósito — mesmo
    # achado de 2026-10-10 em reativacao.yml: hora cheia exata faz o
    # GitHub Actions atrasar o run de verdade por horas.
    - cron: "9 11 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-leiloes.mjs
      - name: Checar alertas de leilão (leilão novo na agenda)
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://www.safralume.com.br/api/cron/leiloes-alertas
