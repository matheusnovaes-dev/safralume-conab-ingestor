name: Ingest agenda de leilões

on:
  schedule:
    # Todo dia, 11:00 UTC — a agenda muda com frequência (novos leilões
    # entram, outros viram "ao vivo" ou saem da lista), payload pequeno
    # (~35 páginas por rodada).
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run ingest-leiloes.mjs
